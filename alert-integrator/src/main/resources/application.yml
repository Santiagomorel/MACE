app:
  alerting:
    webhook:
      path: /api/v1/alerts
    worker-pool-size: 5
    queue-max-size: 1000
    event-dedup-ttl-minutes: 5
    secret-dedup:
      false-positive-cooldown-hours: 24
      true-positive-cooldown-hours: 1
      in-progress-immediate-skip: true

  providers:
    gitguardian:
      shared-secret: ${GITGUARDIAN_WEBHOOK_SECRET:changeme}
      signature-header: X-GitGuardian-Signature
      signature-algorithm: hmac-sha256
      allowed-ips:
        - 72.14.199.0/24
        - 184.172.192.0/24
      enabled: true

  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    max-age: 3600

  admin:
    api-key: ${ADMIN_API_KEY:}
    api-key-enforce: ${ADMIN_API_KEY_ENFORCE:true}

  dlq:
    retention-days: 7
    max-retries: 3

spring:
  application:
    name: alert-integrator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credential_rotation}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.company.rotations.alerting: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        descriptions: true

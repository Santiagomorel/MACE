app:
  logging:
    audit-retention-days: 90

logging:
  level:
    com.company.rotations.logging: DEBUG
    com.company.rotations.alerting: INFO
    com.company.rotations.verification: INFO
    com.company.rotations.decision: INFO
    com.company.rotations.action: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        descriptions: true

server:
  port: 8084

spring:
  application:
    name: action-executor

actionexecutor:
  vault:
    encryption-key: ${VAULT_ENCRYPTION_KEY:defaultkey1234567890}
  notifications:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
    email:
      smtp-host: ${EMAIL_SMTP_HOST:localhost}
      smtp-port: ${EMAIL_SMTP_PORT:587}
      from: ${EMAIL_FROM:security@mace.local}
    ticket:
      webhook-url: ${TICKET_WEBHOOK_URL:}

aws:
  region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

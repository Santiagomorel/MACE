server:
  port: 8083

spring:
  application:
    name: decision-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/rotation_system
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Drools configuration
decision:
  drools:
    cache-ttl-seconds: 300
    max-drl-size-bytes: 51200
    semaphore-ttl-seconds: 900

# Discovery configuration
  discovery:
    poll-interval-hours: 3
    semaphore-wait-seconds: 30

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

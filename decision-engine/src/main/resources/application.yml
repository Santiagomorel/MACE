server:
  port: 8083

spring:
  application:
    name: decision-engine
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Drools configuration
decision:
  drools:
    cache-ttl-seconds: 300
    max-drl-size-bytes: 51200
    semaphore-ttl-seconds: 900

  discovery:
    poll-interval-hours: 3
    semaphore-wait-seconds: 30
    scheduled-rate: 10800000
    enabled: true

  webhook:
    credential-exposure:
      enabled: true
      signature-validation: false
    rate-limit-per-tenant-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

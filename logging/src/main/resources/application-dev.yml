---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.company.rotations.logging: DEBUG
    com.company.rotations.alerting: DEBUG
    com.company.rotations.verification: DEBUG
    com.company.rotations.decision: DEBUG
    com.company.rotations.actionexecutor: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  logging:
    audit-retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,conditions
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: staging

logging:
  level:
    com.company.rotations.logging: INFO
    com.company.rotations.alerting: INFO
    com.company.rotations.verification: INFO
    com.company.rotations.decision: INFO
    com.company.rotations.actionexecutor: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

app:
  logging:
    audit-retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.company.rotations.logging: INFO
    com.company.rotations.alerting: INFO
    com.company.rotations.verification: INFO
    com.company.rotations.decision: INFO
    com.company.rotations.actionexecutor: INFO
    org.springframework.web: ERROR
    org.springframework.security: WARN
    ROOT: WARN

app:
  logging:
    audit-retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        app.pipeline.duration: true
      slo:
        app.pipeline.duration: 50ms,100ms,250ms,500ms,1000ms

---
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    com.company.rotations.logging: DEBUG
    com.company.rotations.alerting: DEBUG
    com.company.rotations.verification: DEBUG
    com.company.rotations.decision: DEBUG
    com.company.rotations.actionexecutor: DEBUG

app:
  logging:
    audit-retention-days: 90

server:
  port: 8082

spring:
  application:
    name: alert-integrator

app:
  alerting:
    webhook:
      path: /api/v1/alerts
    worker-pool-size: 5
    queue-max-size: 1000
    event-dedup-ttl-minutes: 5
    secret-dedup:
      false-positive-cooldown-hours: 24
      true-positive-cooldown-hours: 1
      in-progress-immediate-skip: true

  providers:
    gitguardian:
      shared-secret: ${GITGUARDIAN_WEBHOOK_SECRET:changeme}
      signature-header: X-GitGuardian-Signature
      signature-algorithm: hmac-sha256
      allowed-ips:
        - 72.14.199.0/24
        - 184.172.192.0/24
      enabled: true

  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    max-age: 3600

  admin:
    api-key: ${ADMIN_API_KEY:}
    api-key-enforce: ${ADMIN_API_KEY_ENFORCE:true}

  dlq:
    retention-days: 7
    max-retries: 3
